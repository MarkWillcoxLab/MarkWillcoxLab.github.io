# Sync publications from ORCID to _publications.
# Runs monthly (1st of month) and can be triggered manually.
name: Sync ORCID publications

on:
  schedule:
    # Run at 00:00 UTC on the 1st of every month
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write  # read + write so we can push new pubcalication files

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync publications from ORCID
        run: python3 scripts/sync_orcid_publications.py

      - name: Commit and push if there are new publications
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _publications/
          if git diff --staged --quiet; then
            echo "No new publications to commit."
          else
            git commit -m "chore: add new publications from ORCID [automated]"
            git push
          fi
