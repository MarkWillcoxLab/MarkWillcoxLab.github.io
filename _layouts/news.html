---
layout: default
---

<style>
.ambassador-slideshow { position: relative; max-width: 100%; margin: 0 auto 1.5rem; }
.ambassador-slideshow-wrapper { position: relative; overflow: hidden; }
.ambassador-slide { display: none; }
.ambassador-slide img { width: 100%; height: auto; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
.ambassador-slide.active { display: block; }
.ambassador-slideshow-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(13,110,253,0.8); color: white; border: none; padding: 0.5rem 0.75rem; cursor: pointer; font-size: 1.25rem; border-radius: 4px; }
.ambassador-slideshow-btn:hover { background: rgba(13,110,253,1); }
.ambassador-slideshow-btn.prev { left: 0.5rem; }
.ambassador-slideshow-btn.next { right: 0.5rem; }
.ambassador-slideshow-dots { text-align: center; margin-top: 0.75rem; }
.ambassador-dot { display: inline-block; width: 10px; height: 10px; margin: 0 4px; background: #ccc; border-radius: 50%; cursor: pointer; }
.ambassador-dot:hover, .ambassador-dot.active { background: #0d6efd; }
</style>

<section class="page-header">
    <div class="container">
        <div class="row">
            <div class="col-12 text-center">
                {% if page.date %}
                <p class="text-muted mb-2">{{ page.date | date: "%B %d, %Y" }}</p>
                {% endif %}
                <h1>{{ page.title }}</h1>
            </div>
        </div>
    </div>
</section>

<section class="py-5">
    <div class="container">
        <div class="row">
            <div class="col-md-8 mx-auto">
                {% if page.slideshow_images %}
                <div class="ambassador-slideshow">
                    <div class="ambassador-slideshow-wrapper">
                        {% for img in page.slideshow_images %}
                        <div class="ambassador-slide {% if forloop.first %}active{% endif %}">
                            <img src="{{ img | relative_url }}" class="img-fluid" alt="{{ page.title }}">
                        </div>
                        {% endfor %}
                    </div>
                    <button class="ambassador-slideshow-btn prev" aria-label="Previous">&#10094;</button>
                    <button class="ambassador-slideshow-btn next" aria-label="Next">&#10095;</button>
                    <div class="ambassador-slideshow-dots">
                        {% for img in page.slideshow_images %}
                        <span class="ambassador-dot {% if forloop.first %}active{% endif %}" data-slide="{{ forloop.index0 }}"></span>
                        {% endfor %}
                    </div>
                </div>
                <script>
                (function() {
                    var c = document.currentScript.closest('.col-md-8');
                    var slides = c.querySelectorAll('.ambassador-slide');
                    var dots = c.querySelectorAll('.ambassador-dot');
                    var total = slides.length;
                    var slideIndex = 0;
                    function showSlide(n) {
                        slideIndex = (n + total) % total;
                        slides.forEach(function(s, i) { s.classList.toggle('active', i === slideIndex); });
                        dots.forEach(function(d, i) { d.classList.toggle('active', i === slideIndex); });
                    }
                    c.querySelector('.ambassador-slideshow-btn.next').addEventListener('click', function() { showSlide(slideIndex + 1); });
                    c.querySelector('.ambassador-slideshow-btn.prev').addEventListener('click', function() { showSlide(slideIndex - 1); });
                    dots.forEach(function(d, i) { d.addEventListener('click', function() { showSlide(i); }); });
                    setInterval(function() { showSlide(slideIndex + 1); }, 5000);
                })();
                </script>
                {% elsif page.image %}
                <img src="{{ page.image | relative_url }}" class="img-fluid rounded mb-4" alt="{{ page.title }}">
                {% endif %}
                <div class="news-content">
                    {{ content }}
                </div>
            </div>
        </div>
    </div>
</section>
