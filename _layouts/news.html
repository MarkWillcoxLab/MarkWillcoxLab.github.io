---
layout: default
---

<section class="page-header">
    <div class="container">
        <div class="row">
            <div class="col-12 text-center">
                {% if page.date %}
                <p class="text-muted mb-2">{{ page.date | date: "%B %d, %Y" }}</p>
                {% endif %}
                <h1>{{ page.title }}</h1>
            </div>
        </div>
    </div>
</section>

<section class="py-5">
    <div class="container">
        <div class="row">
            <div class="col-md-8 mx-auto">
                {% if page.image %}
                <img src="{{ page.image | relative_url }}" class="img-fluid rounded mb-4" alt="{{ page.title }}">
                {% endif %}
                <div class="news-content">
                    {{ content }}
                </div>
            </div>
        </div>
    </div>
</section>
